# Regras de replicação para o Debezium (repositório estoque-analytics-cdc).
#
# NOTA: pg_hba.conf não aceita hostname combinado com máscara de rede
# (ex: "host.docker.internal/0" não é sintaxe válida — a máscara só se
# aplica a endereços IP). Como o Debezium se conecta via host.docker.internal,
# cujo IP pode variar, liberamos por faixa de endereço em vez de hostname.
#
# Aplicado de fato em tempo de execução por infra/postgres/config/init-pg-hba.sh
# (a imagem oficial do Postgres gera o pg_hba.conf padrão no primeiro boot,
# então não dá pra simplesmente montar este arquivo por cima dele).
host    replication     debezium_replicator     0.0.0.0/0       md5
host    all             all                     0.0.0.0/0       md5