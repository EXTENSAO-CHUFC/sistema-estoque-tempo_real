# PostgreSQL - configuração para Debezium
#
# NOTA: estes valores são aplicados de fato via `command:` no
# docker-compose.yml (flags -c), não por este arquivo sendo montado
# diretamente — a imagem oficial do Postgres já vem com um postgresql.conf
# completo, e substituí-lo por este (que só tem 3 linhas) quebraria todo o
# resto das configurações padrão. Este arquivo fica como referência/documentação
# do que precisa estar ativo para a replicação lógica funcionar.
wal_level = logical
max_replication_slots = 10
max_wal_senders = 10